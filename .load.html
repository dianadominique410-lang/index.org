<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identification - Orange</title>
    <style>
        /* RESET & BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* CONTAINER PRINCIPAL */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center; /* Centre horizontalement sur PC */
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px; /* Taille fixe sur PC, s'adapte sur Mobile */
            margin-top: 40px;
        }

        /* LOGO ORANGE OFFICIEL */
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-orange {
            width: 50px; /* Taille identique à ta capture */
            height: 50px;
            /* Si tu as le fichier localement, remplace l'URL ci-dessous par ton chemin d'accès */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c8/Orange_logo.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: inline-block;
        }

        /* TYPOGRAPHIE */
        h1 {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: left; /* Aligné à gauche comme sur ton screen */
        }

        /* CHAMPS DE SAISIE */
        .input-group {
            position: relative;
            margin-bottom: 40px;
            border-bottom: 1px solid #000; /* Juste une ligne du bas */
        }

        input {
            width: 100%;
            border: none;
            padding: 10px 0;
            font-size: 16px;
            outline: none;
            background: transparent;
        }

        /* BOUTON NOIR */
        .btn-continue {
            width: 100%;
            background-color: #000;
            color: #fff;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-continue:hover {
            background-color: #333;
        }

        /* NAVIGATION RETOUR */
        .back-link {
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: left;
        }
        .back-link span {
            margin-right: 10px;
            font-size: 20px;
        }

        /* FOOTER NOIR (Adaptatif) */
        footer {
            background-color: #000;
            color: #fff;
            padding: 40px 20px;
            margin-top: 50px;
        }

        .footer-content {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 colonnes sur mobile */
            gap: 20px;
        }

        @media (min-width: 768px) {
            .footer-content {
                grid-template-columns: repeat(4, 1fr); /* 4 colonnes sur ordi */
            }
        }

        .footer-content div {
            font-size: 13px;
            cursor: pointer;
        }

        .footer-content div:hover {
            text-decoration: underline;
        }

        .copyright {
            max-width: 1000px;
            margin: 30px auto 0;
            color: #999;
            font-size: 12px;
            text-align: left;
        }

        /* MASQUAGE ÉTAPES */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="login-box">
            
            <div class="logo-container">
                <div class="logo-orange"></div>
            </div>

            <div id="step-1">
                <h1>Identifiez-vous</h1>
                <h2>Indiquez votre compte Orange</h2>
                
                <div class="input-group">
                    <input type="text" id="email" placeholder="Adresse e-mail ou n° de mobile Orange">
                </div>

                <button class="btn-continue" onclick="toStep2()">Continuer</button>
            </div>

            <div id="step-2" class="hidden">
                <div class="back-link" onclick="toStep1()">
                    <span>←</span> <small id="user-val"></small>
                </div>
                <h1>Saisissez votre mot de passe</h1>
                
                <div class="input-group">
                    <input type="password" id="pass" placeholder="Mot de passe">
                </div>

                <button class="btn-continue">Se connecter</button>
            </div>

        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div>Informations légales</div>
            <div>Gestion cookies</div>
            <div>Plan de site</div>
            <div>Livraisons</div>
            <div>Données personnelles</div>
            <div>Retours</div>
            <div>Accessibilité</div>
            <div>Publicité</div>
        </div>
        <p class="copyright">© Orange 2026</p>
    </footer>

    <script>
        function toStep2() {
            const val = document.getElementById('email').value;
            if(val.trim() !== "") {
                document.getElementById('user-val').innerText = val;
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
            }
        }

        function toStep1() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }
    </script>

</body>
</html>
